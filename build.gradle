plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.escobar'
version = '0.0.1-SNAPSHOT'
description = 'Project for "Acid Tango" technical test'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
    byteBuddyAgent
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:spring-mock-mvc:5.5.0'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb'

    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.1'
    implementation 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    byteBuddyAgent 'net.bytebuddy:byte-buddy-agent:1.17.8'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9"
}

bootJar {
    archiveBaseName = 'itx-backend'
    archiveVersion = '0.0.1'
    mainClass = 'com.escobar.itx_2.Itx2Application'
}

jar {
    enabled = true
}

test {
	useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.byteBuddyAgent.singleFile}"
}